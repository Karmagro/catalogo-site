name: Reportar un error
description: Una errata, un enlace roto, un mapeo que no coincide con la ficha, una imagen que no carga, algo que se ve mal.
title: "Error: <resumen breve>"
labels: ["error"]
body:
  - type: input
    id: pagina
    attributes:
      label: Página
      description: La URL de la página donde está el error.
      placeholder: https://catalogo-componentes-software.pages.dev/docs/componentes/mantenedor
    validations:
      required: true

  - type: textarea
    id: dice
    attributes:
      label: Qué dice o qué pasa
      description: Copia el texto tal como está, o describe lo que se ve. Si es visual, una captura ayuda (se puede pegar aquí).
    validations:
      required: true

  - type: textarea
    id: deberia
    attributes:
      label: Qué debería decir o qué debería pasar
      description: Si es una errata, el texto corregido. Si es un problema de criterio (un mapeo, una delimitación), por qué crees que está mal.
    validations:
      required: true

  - type: input
    id: entorno
    attributes:
      label: Navegador y modo (claro u oscuro)
      description: Solo para problemas visuales.
      placeholder: Firefox en Windows, modo oscuro
