# Verifica el catálogo en cada pull request y en cada push a main o dev:
# script de verificación, tipos y build completo (npm run verificar:todo).
name: verificar

on:
  pull_request:
  push:
    branches: [main, dev]

jobs:
  verificar:
    name: verificar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run verificar:todo
